name: PR check
on:
  pull_request:
    branches: ['**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # 不使用任何真实 API Key：测试全部基于模拟数据与 mock provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
